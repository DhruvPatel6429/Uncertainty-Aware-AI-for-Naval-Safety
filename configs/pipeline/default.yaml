# Default pipeline configuration
perception:
  uq_method: bayesian
  uq_config:
    n_mc_samples: 10
    reject_threshold: 0.5
  confidence_threshold: 0.5
  epistemic_threshold: 0.4
  ood_threshold: 0.7
  n_classes: 5

prediction:
  uq_method: ensemble
  uq_config:
    temperature: 1.0
  horizon_seconds: 30
  n_history_steps: 10
  directional_cone_alpha: 0.05

planning:
  colregs_penalty_weight: 1.0
  uncertainty_penalty_weight: 1.0
  energy_penalty_weight: 0.1
  safety_margin_m: 50.0
  n_waypoints: 8
  planning_horizon_s: 60

decision:
  collision_prob_bound: 1.0e-4
  epistemic_reject_threshold: 0.7
  fallback_action: EMERGENCY_FALLBACK
  enable_audit_log: true
