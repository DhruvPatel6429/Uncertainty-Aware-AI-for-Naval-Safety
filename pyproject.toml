[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uq-naval"
version = "1.0.0"
description = "Uncertainty-Aware AI for Safety-Critical Naval Applications"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Principal Investigator", email = "pi@uq-naval.local" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "mlflow>=2.7.0",
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.4.0",
    "websockets>=11.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring a GPU",
]

[tool.coverage.run]
source = ["src/uq_naval"]
omit = ["*/tests/*", "*/__init__.py"]
